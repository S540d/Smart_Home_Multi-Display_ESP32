; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	lovyan03/LovyanGFX@^1.1.16
	bitbank2/bb_captouch@^1.3.1
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.5
; Display-Treiber (ST7789, JC2432W328) wird in src/display_lgfx.h im Code konfiguriert,
; nicht mehr über TFT_eSPI-Build-Flags.

; Update per WLAN (ArduinoOTA, Hostname SmartHomeDisplay, Port 3232):
;   export OTA_PASSWORD=...   (Wert CONFIG_OTA_PASSWORD aus src/config_secrets.h)
;   pio run -e esp32dev_ota --target upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = SmartHomeDisplay.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --port=3232
